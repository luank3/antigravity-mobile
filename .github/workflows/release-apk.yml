name: Release Android APK & Go Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: server/go.sum

      - name: Test Go server code
        working-directory: server
        run: |
          go test -count=1 ./... -race

      - name: Build cross-platform agyd & agy-relay binaries
        working-directory: server
        run: |
          mkdir -p bin
          TARGETS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          for target in "${TARGETS[@]}"; do
            os="${target%%/*}"
            arch="${target##*/}"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            echo "Building agyd and agy-relay for $os/$arch..."
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
              -o "bin/agyd-${os}-${arch}${ext}" ./cmd/agyd
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
              -o "bin/agy-relay-${os}-${arch}${ext}" ./cmd/agy-relay
          done
          ls -lh bin/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK 28.2.13676358
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "ndk;28.2.13676358"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build Android arm64-v8a libagyp2p.so
        working-directory: server
        run: |
          mkdir -p ../mobile/android/app/src/main/jniLibs/arm64-v8a
          CC="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
          CGO_ENABLED=1 \
          GOOS=android \
          GOARCH=arm64 \
          go build -buildmode=c-shared -trimpath -ldflags="-checklinkname=0 -s -w" \
            -o ../mobile/android/app/src/main/jniLibs/arm64-v8a/libagyp2p.so ./pkg/mobilebridge
          rm -f ../mobile/android/app/src/main/jniLibs/arm64-v8a/libagyp2p.h

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > mobile/android/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
              > mobile/android/key.properties
            echo "ANDROID_RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            echo "Android release signing configured."
          else
            echo "ANDROID_RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            echo "No keystore secret configured; falling back to debug signing."
          fi

      - name: Analyze, test, and build split-per-abi Android release APKs
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test -r expanded test/widget_test.dart
          flutter build apk --release --split-per-abi --target-platform android-arm64
          ls -lh build/app/outputs/flutter-apk/

      - name: Verify signed APK & checksums
        run: |
          APK="mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ ! -f "$APK" ]; then
            APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          fi
          echo "Verifying APK: $APK"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)"
          CERT_OUT="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERT_OUT"
          if [ "${ANDROID_RELEASE_SIGNED:-false}" = "true" ] && echo "$CERT_OUT" | grep -qi "Android Debug"; then
            echo "ERROR: expected release keystore signature, got debug certificate" >&2
            exit 1
          fi
          ls -lh "$APK" server/bin/*
          sha256sum "$APK" server/bin/* > release-checksums.txt
          cat release-checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-mobile-release
          path: |
            mobile/build/app/outputs/flutter-apk/app-*-release.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
            server/bin/*
            release-checksums.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mobile/build/app/outputs/flutter-apk/app-*-release.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
            server/bin/*
            release-checksums.txt
